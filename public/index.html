<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable: sonst zoomt ein schneller Doppeltipp rein -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141031">
<title>Trinkspiele</title>

<!-- Das ?v=25 ist wichtig: Ein Handy, das style.css schon einmal geladen hat,
     kann sie hartnaeckig behalten. Eine neue Adresse muss es dagegen frisch
     holen. Die Nummer muss zu VERSION in app.js passen (test-ui.js prueft das). -->
<link rel="stylesheet" href="/style.css?v=25">
<link rel="manifest" href="/manifest.webmanifest">

<!-- Icon fuer den Homescreen -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">

<!-- Ohne diese Zeilen startet die Seite auf dem iPhone nicht im Vollbild -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trinkspiele">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app" class="app"></div>

  <!-- Wenn beim Laden etwas schiefgeht, blieb die Seite frueher einfach weiss.
       Jetzt steht wenigstens da, woran es liegt. -->
  <script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("app");
    if (!el || el.innerHTML.length > 0) return;
    var was = (e && (e.message || (e.target && e.target.src))) || "unbekannt";
    el.innerHTML =
      '<h2>Die App konnte nicht starten 😕</h2>' +
      '<p class="sub">Meist fehlt eine Datei oder der Browser hat noch eine alte Fassung.' +
      ' Einmal komplett schliessen und neu oeffnen hilft oft.</p>' +
      '<pre class="crash">' + String(was).replace(/[<&]/g, "") + '</pre>' +
      '<button class="wide" onclick="location.reload(true)">Neu laden</button>';
  }, true);
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js?v=25"></script>
</body>
</html>
