<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141031">
<title>Leberschuss – Einzeltest</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #141031; color: #F8F5FF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
  }
  .kopf { display: flex; align-items: center; gap: 10px; flex: none; }
  .kopf h1 { font-size: 17px; margin: 0; font-weight: 800; flex: 1; }
  .zahl {
    background: #221C4D; border: 1.5px solid #4A3F92; border-radius: 12px;
    padding: 5px 11px; font-size: 14px; font-weight: 800;
  }
  .zahl b { color: #FFC93C; }

  .teams { flex: none; display: flex; gap: 8px; }
  .team {
    flex: 1; background: #1C1741; border: 1.5px solid #372E77; border-radius: 12px;
    padding: 6px 9px 7px;
  }
  .team.dran { border-color: #FFC93C; background: #262052; }
  .team .kopfzeile { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 800; }
  .team .kopfzeile span { margin-left: auto; font-size: 11px; color: #A79FD1; font-weight: 700; }
  .balken { height: 7px; border-radius: 4px; background: #120E2E; margin-top: 5px; overflow: hidden; }
  .balken i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .3s; }
  .t0 .balken i { background: linear-gradient(90deg, #9AA0AC, #E6E9F0); }
  .t1 .balken i { background: linear-gradient(90deg, #2A6FA8, #7CC4F5); }
  .t0 b { color: #E6E9F0; }
  .t1 b { color: #7CC4F5; }

  canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
  .texte { flex: none; }
  .hinweis { margin: 0; font-size: 13px; line-height: 1.35; color: #F0ECFF; font-weight: 700; }
  .regel { margin: 3px 0 0; font-size: 11px; line-height: 1.3; color: #8880B8; font-weight: 600; }
  .fuss { flex: none; display: flex; align-items: center; gap: 10px; }
  button {
    font: inherit; font-size: 15px; font-weight: 800; color: #fff;
    border: 0; border-radius: 14px; padding: 12px 16px;
    background: linear-gradient(135deg, #FF5FA2, #8B5CF6);
  }
  button.grau { background: #2C2560; border: 1.5px solid #4A3F92; }
  button.gross { flex: 1; font-size: 17px; padding: 15px 16px; }
  button.klein { flex: 1; font-size: 13px; padding: 9px 12px; }
  button[hidden] { display: none; }
  button.stopp { background: linear-gradient(135deg, #FF9F1C, #FF3B6B); }
</style>
</head>
<body>
<div class="wrap">
  <div class="kopf">
    <h1>Leberschuss</h1>
    <div class="zahl" id="stand">0 : 0</div>
    <div class="zahl">Runde <b id="summe">1</b></div>
  </div>
  <canvas id="feld"></canvas>
  <div class="texte">
    <p class="hinweis" id="hinweis">…</p>
    <p class="regel" id="regel">Berührt ein Korken ein Feld auch nur mit dem Rand, zählt es –
      und immer das wertvollere. Auf der eigenen Hälfte bekommt sie der Gegner.</p>
  </div>
  <div class="fuss">
    <button class="gross" id="knopf">Losschnippsen</button>
    <button class="gross grau" id="knopf2" hidden></button>
  </div>
  <div class="fuss">
    <button class="grau klein" id="oben">Von oben</button>
    <button class="grau klein" id="neu">Neu</button>
  </div>
</div>

<script type="module">
// Die Einzelseite zum Ausprobieren: dasselbe Spiel wie in der App, nur auf
// einem Handy, das herumgereicht wird. Regeln, Physik und Zeichnen kommen aus
// denselben Modulen - hier steht nur die Bedienung.

import {
  initLeber, schuss, amZug, letzteBewegung,
  pfeilRichtung, balkenKraft, teamPlaetze,
  verteile, antworte, leerBestaetigen, leerAblehnen, teamGetrunken, kapitaenVon,
  PLAETZE, TEAM_NAME,
} from "/game/leber.js";
import { macheZeichner } from "/leber3d.js";

const cv = document.getElementById("feld");
const summeEl = document.getElementById("summe");
const hinweisEl = document.getElementById("hinweis");
const knopfEl = document.getElementById("knopf");
const knopf2El = document.getElementById("knopf2");
const obenEl = document.getElementById("oben");
const standEl = document.getElementById("stand");
const zeichner = macheZeichner(cv);

const SPIELER = PLAETZE.map((p, i) => ({ id: "p" + i, name: `Spieler ${i + 1}` }));
const wo = (nr) => (PLAETZE[nr].seite === "nah" ? "vorne" : "hinten") + " " + PLAETZE[nr].hand;

let g = initLeber(SPIELER);
let zielen = null;    // { nr, phase, t0, richtung, kraft }
let abspielen = null; // { bilder, dt, start, i, korken }
let getroffen = [];

// Was die drei Knoepfe gerade tun. Auf einem Handy, das herumgereicht wird,
// wechselt das staendig - deshalb steht die Bedeutung hier und nicht im HTML.
let tun = { knopf: null, knopf2: null };
let oben = false; // von Hand auf Draufsicht geschaltet

// ---------------------------------------------------------------------------
// Zeichnen
// ---------------------------------------------------------------------------

/** Was der Zeichner sehen soll. Waehrend eines Schusses die Zwischenstaende. */
const bild = () => ({
  korken: abspielen?.korken ?? g.korken,
  eigener: g.phase === "play" && !abspielen ? amZug(g) : -1,
  zielen,
  getroffen,
  namen: SPIELER.map((p) => p.name),
});

const malen = () => zeichner.zeichne(bild());

/** Einen Knopf beschriften und mit einer Aufgabe versehen - oder ausblenden. */
function knopf(el, name, text, aufgabe) {
  tun[name] = aufgabe ?? null;
  el.textContent = text ?? "";
  el.hidden = !aufgabe;
}

/** Wer die letzten Schluecke bekommen hat - kurz, damit alle es sehen. */
function aufteilung() {
  const v = g.letzte?.verteilt ?? [];
  const teile = [0, 1]
    .filter((t) => teamPlaetze(t).some((i) => v[i] > 0))
    .map(
      (t) =>
        `${TEAM_NAME[t]}: ` +
        teamPlaetze(t)
          .filter((i) => v[i] > 0)
          .map((i) => `${SPIELER[i].name} ${v[i]}`)
          .join(" · ")
    );
  return teile.join("  |  ");
}

/** Alles, was nicht das Spielfeld ist: Texte und Knoepfe. */
function anzeigen() {
  summeEl.textContent = g.runde;
  standEl.textContent = `${teamGetrunken(g, 0)} : ${teamGetrunken(g, 1)}`;
  knopf(knopf2El, "knopf2", "", null);
  obenEl.textContent = oben ? "Vom Platz" : "Von oben";
  obenEl.hidden = g.phase !== "play" || !!abspielen;

  if (g.phase === "finished") {
    hinweisEl.textContent = `${TEAM_NAME[g.sieger]} hat beide Flaschen leer. Gewonnen!`;
    knopf(knopfEl, "knopf", "Neues Spiel", neuesSpiel);
    return;
  }

  if (g.phase === "bestaetigen") {
    const nr = g.leer.nr;
    const gegner = teamPlaetze(1 - PLAETZE[nr].team)[0];
    hinweisEl.textContent = `${SPIELER[nr].name} sagt: Flasche leer. ${
      TEAM_NAME[PLAETZE[gegner].team]
    } bestätigen?`;
    knopf(knopfEl, "knopf", "Stimmt", () => tuIt(leerBestaetigen(g, SPIELER[gegner].id)));
    knopf(knopf2El, "knopf2", "Nee", () => tuIt(leerAblehnen(g, SPIELER[gegner].id)));
    return;
  }

  if (g.phase === "leerfrage") {
    const nr = g.antwort.findIndex((a) => a === null);
    hinweisEl.textContent = `${aufteilung() || "Nichts getroffen."}  ·  ${
      SPIELER[nr].name
    }: Flasche leer?`;
    knopf(knopfEl, "knopf", "🍾 Leer", () => tuIt(antworte(g, SPIELER[nr].id, true)));
    knopf(knopf2El, "knopf2", "Noch nicht", () => tuIt(antworte(g, SPIELER[nr].id, false)));
    return;
  }

  if (g.phase === "verteilen") {
    // Beide Teams teilen auf - am gemeinsamen Handy eins nach dem anderen.
    const team = g.offen[0] > 0 ? 0 : 1;
    const [a, b] = teamPlaetze(team);
    const kap = kapitaenVon(g, team).id; // nur der Kapitaen teilt auf
    hinweisEl.textContent = `${TEAM_NAME[team]}: ${g.offen[team]} ${
      g.offen[team] === 1 ? "Schluck" : "Schlücke"
    } – ${kapitaenVon(g, team).name} teilt auf`;
    knopf(knopfEl, "knopf", SPIELER[a].name + zusatz(a), () => tuIt(verteile(g, kap, SPIELER[a].id)));
    knopf(knopf2El, "knopf2", SPIELER[b].name + zusatz(b), () => tuIt(verteile(g, kap, SPIELER[b].id)));
    return;
  }

  const nr = amZug(g);
  if (zielen) {
    hinweisEl.textContent = zielen.phase === "kraft" ? "Kraft stoppen." : "Pfeil stoppen.";
    knopf(knopfEl, "knopf", "Stopp", weiter);
  } else {
    hinweisEl.textContent = `${SPIELER[nr].name} ist dran – Korken ${wo(nr)}.`;
    knopf(knopfEl, "knopf", "Losschnippsen", weiter);
  }
}

const zusatz = (i) => (g.fertig[i] ? " (leer)" : g.letzte?.verteilt[i] ? ` ${g.letzte.verteilt[i]}` : "");

/** Einen neuen Stand uebernehmen und alles nachziehen. */
function tuIt(neuerStand) {
  if (neuerStand === g) return;
  g = neuerStand;
  if (g.phase !== "play") {
    getroffen = (g.letzte?.einzeln ?? []).filter(Boolean).map((w) => w.feld);
    zeichner.kameraOben(g.reihe[g.reihe.length - 1]);
  }
  anzeigen();
  malen();
}

// ---------------------------------------------------------------------------
// Ein Zug
// ---------------------------------------------------------------------------

function neuerZug() {
  const nr = amZug(g);
  if (nr === undefined) return;
  if (oben) zeichner.kameraOben(nr);
  else zeichner.kameraSpieler(nr);
  anzeigen();
  malen();
}

function zielSchleife() {
  if (!zielen) return;
  const seit = performance.now() - zielen.t0;
  if (zielen.phase === "richtung") zielen.richtung = pfeilRichtung(g.korken, zielen.nr, seit);
  else zielen.kraft = balkenKraft(seit);
  malen();
  requestAnimationFrame(zielSchleife);
}

function weiter() {
  if (abspielen || g.phase !== "play") return;

  if (zielen) {
    // Wichtig: der Wert wird JETZT aus der Uhr gerechnet, nicht aus dem zuletzt
    // gezeichneten Bild. Sonst entscheidet nicht der Moment des Drueckens,
    // sondern wann der Browser zuletzt zum Zeichnen kam.
    const seit = performance.now() - zielen.t0;
    if (zielen.phase === "richtung") {
      zielen.richtung = pfeilRichtung(g.korken, zielen.nr, seit);
      zielen.phase = "kraft";
      zielen.t0 = performance.now();
      zielen.kraft = 0;
      anzeigen();
      return;
    }
    const { nr, richtung } = zielen;
    const kraft = balkenKraft(seit);
    zielen = null;
    hinweisEl.textContent = "…";
    g = schuss(g, SPIELER[nr].id, richtung, kraft);
    spieleAb();
    return;
  }

  const nr = amZug(g);
  if (nr === undefined || g.korken[nr]?.raus) return;
  zielen = { nr, phase: "richtung", t0: performance.now(), richtung: 0, kraft: 0 };
  getroffen = [];
  anzeigen();
  zielSchleife();
}

/**
 * Den letzten Schuss abspielen. Der Spielstand ist schon der von NACHHER - die
 * Animation legt sich nur darueber. Gerechnet wird mit 480 Schritten je
 * Sekunde, das Bild kommt 60 mal: also wird zu jedem Bild der passende
 * Rechenschritt herausgesucht. Ein Schuss dauert dadurch genauso lange wie am
 * Tisch, eine gute halbe Sekunde.
 */
function spieleAb() {
  const bewegung = letzteBewegung(g);
  if (!bewegung) return nachDemSchuss();
  abspielen = { ...bewegung, start: undefined, korken: g.korken };
  requestAnimationFrame(lauf);
}

function lauf(jetzt) {
  const a = abspielen;
  if (!a) return;
  if (a.start === undefined) a.start = jetzt;

  const i = Math.max(0, Math.min(Math.round((jetzt - a.start) / 1000 / a.dt), a.bilder.length - 1));
  a.korken = a.bilder[i].map((p, n) => ({ ...g.korken[n], x: p.x, y: p.y, raus: p.raus }));
  malen();

  if (i >= a.bilder.length - 1) {
    abspielen = null;
    return nachDemSchuss();
  }
  requestAnimationFrame(lauf);
}

function nachDemSchuss() {
  if (g.phase === "play") return neuerZug();

  // Runde vorbei: von oben draufschauen, damit man sieht, wo alles liegt.
  getroffen = (g.letzte?.einzeln ?? []).filter(Boolean).map((w) => w.feld);
  zeichner.kameraOben(g.reihe[g.reihe.length - 1]);
  anzeigen();
  malen();
}

function neuesSpiel() {
  g = initLeber(SPIELER);
  oben = false;
  zielen = null;
  abspielen = null;
  getroffen = [];
  neuerZug();
}

/** Ein Tipp aufs Feld macht dasselbe wie der grosse Knopf. */
const tippen = () => tun.knopf?.();

obenEl.addEventListener("click", () => {
  if (g.phase !== "play" || abspielen) return;
  oben = !oben;
  const nr = amZug(g);
  if (oben) zeichner.kameraOben(nr);
  else zeichner.kameraSpieler(nr);
  anzeigen();
  malen();
});

cv.addEventListener("pointerdown", tippen);
knopfEl.addEventListener("click", tippen);
knopf2El.addEventListener("click", () => tun.knopf2?.());
document.getElementById("neu").addEventListener("click", neuesSpiel);
window.addEventListener("resize", () => {
  zeichner.messen();
  malen();
});

neuerZug();
</script>
</body>
</html>
