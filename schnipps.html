<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141031">
<title>Leberschuss – Schnipp-Test</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #141031; color: #F8F5FF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
  }
  .kopf { display: flex; align-items: center; gap: 10px; flex: none; }
  .kopf h1 { font-size: 17px; margin: 0; font-weight: 800; flex: 1; }
  .zahl {
    background: #221C4D; border: 1.5px solid #4A3F92; border-radius: 12px;
    padding: 5px 11px; font-size: 14px; font-weight: 800;
  }
  .zahl b { color: #FFC93C; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
  .fuss { flex: none; display: flex; align-items: center; gap: 10px; }
  .hinweis { flex: 1; font-size: 13px; line-height: 1.35; color: #A79FD1; font-weight: 600; }
  button {
    font: inherit; font-size: 15px; font-weight: 800; color: #fff;
    border: 0; border-radius: 14px; padding: 12px 16px;
    background: linear-gradient(135deg, #FF5FA2, #8B5CF6);
  }
  button.grau { background: #2C2560; border: 1.5px solid #4A3F92; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kopf">
    <h1>Leberschuss – Schnipp-Test</h1>
    <div class="zahl">Runde <b id="summe">0</b></div>
  </div>
  <canvas id="feld"></canvas>
  <div class="fuss">
    <p class="hinweis" id="hinweis">Korken antippen, zurückziehen, loslassen.</p>
    <button class="grau" id="neu">Neu</button>
  </div>
</div>

<script type="module">
import {
  FELD, FELDER, FLASCHEN, ECKEN, KORKEN_R, MAX_TEMPO,
  schiesse, rundenWertung, wertung,
} from "/schnipps.js";

const cv = document.getElementById("feld");
const ctx = cv.getContext("2d");
const summeEl = document.getElementById("summe");
const hinweisEl = document.getElementById("hinweis");

// Vier Korken wie im echten Spiel: zwei eigene Ecken, zwei gegenüber.
const START = [
  { x: ECKEN[0].x, y: ECKEN[0].y, team: 0 },
  { x: ECKEN[1].x, y: ECKEN[1].y, team: 0 },
  { x: ECKEN[0].x, y: FELD.laenge - ECKEN[0].y, team: 1 },
  { x: ECKEN[1].x, y: FELD.laenge - ECKEN[1].y, team: 1 },
];

let korken = START.map((k) => ({ ...k }));
let ziehen = null;   // { nr, vonX, vonY, zuX, zuY }
let abspielen = null; // { bilder, i }

// --- Umrechnen zwischen Zentimetern und Bildschirm ------------------------
let sk = 1, offX = 0, offY = 0;

function messen() {
  const b = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(b.width * dpr);
  cv.height = Math.round(b.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sk = Math.min(b.width / FELD.breite, b.height / FELD.laenge);
  offX = (b.width - FELD.breite * sk) / 2;
  offY = (b.height - FELD.laenge * sk) / 2;
}
// y wird gespiegelt: im Spiel zeigt y nach vorne, auf dem Schirm nach unten
const px = (x) => offX + x * sk;
const py = (y) => offY + (FELD.laenge - y) * sk;
const cmX = (sx) => (sx - offX) / sk;
const cmY = (sy) => FELD.laenge - (sy - offY) / sk;

// --- Zeichnen --------------------------------------------------------------
const FARBE = { 1: "#3E7A5E", 2: "#5E8F3E", 3: "#C79A2A" };

function malen() {
  const b = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, b.width, b.height);

  // Tisch
  ctx.fillStyle = "#12563F";
  ctx.fillRect(px(0), py(FELD.laenge), FELD.breite * sk, FELD.laenge * sk);
  ctx.strokeStyle = "#7A4E2A";
  ctx.lineWidth = 5;
  ctx.strokeRect(px(0), py(FELD.laenge), FELD.breite * sk, FELD.laenge * sk);

  // Wertungsfelder
  for (const f of FELDER) {
    ctx.fillStyle = f.mama ? "rgba(255,80,90,.55)" : (FARBE[f.punkte] ?? "#444") + "cc";
    ctx.fillRect(px(f.x), py(f.y + f.h), f.w * sk, f.h * sk);
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px(f.x), py(f.y + f.h), f.w * sk, f.h * sk);

    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.font = `800 ${Math.max(10, sk * 2.4)}px sans-serif`;
    ctx.textAlign = "left";
    ctx.fillText(f.mama ? "Mama" : f.punkte + "", px(f.x + 1.2), py(f.y + f.h) + sk * 3.4);
  }

  // Mittellinie
  ctx.strokeStyle = "rgba(255,255,255,.28)";
  ctx.setLineDash([sk * 2, sk * 2]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px(0), py(FELD.laenge / 2));
  ctx.lineTo(px(FELD.breite), py(FELD.laenge / 2));
  ctx.stroke();
  ctx.setLineDash([]);

  // Flaschen
  for (const f of FLASCHEN) {
    ctx.beginPath();
    ctx.arc(px(f.x), py(f.y), f.r * sk, 0, Math.PI * 2);
    ctx.fillStyle = "#8B5A2B";
    ctx.fill();
    ctx.strokeStyle = "#D2A679";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Korken
  korken.forEach((k, i) => {
    ctx.beginPath();
    ctx.arc(px(k.x), py(k.y), KORKEN_R * sk, 0, Math.PI * 2);
    ctx.fillStyle = k.team === 0 ? "#2EE6C5" : "#FF5FA2";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.45)";
    ctx.lineWidth = 2;
    ctx.stroke();
    if (ziehen?.nr === i) {
      ctx.beginPath();
      ctx.arc(px(k.x), py(k.y), KORKEN_R * sk + 4, 0, Math.PI * 2);
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    }
  });

  // Zielhilfe
  if (ziehen) {
    const k = korken[ziehen.nr];
    const { richtung, kraft } = ausZug(ziehen);
    const weit = 6 + kraft * 26;
    ctx.beginPath();
    ctx.moveTo(px(k.x), py(k.y));
    ctx.lineTo(px(k.x + Math.cos(richtung) * weit), py(k.y + Math.sin(richtung) * weit));
    ctx.strokeStyle = `rgba(255,255,255,${0.3 + kraft * 0.6})`;
    ctx.lineWidth = 3 + kraft * 5;
    ctx.lineCap = "round";
    ctx.stroke();
  }
}

/** Aus dem Ziehen Richtung und Kraft machen: zurückziehen wie bei einer Schleuder. */
function ausZug(z) {
  const dx = z.vonX - z.zuX;
  const dy = z.vonY - z.zuY;
  const d = Math.hypot(dx, dy);
  return { richtung: Math.atan2(dy, dx), kraft: Math.min(1, d / 22) };
}

// --- Antippen --------------------------------------------------------------
function stelle(e) {
  const t = e.touches?.[0] ?? e;
  const b = cv.getBoundingClientRect();
  return { x: cmX(t.clientX - b.left), y: cmY(t.clientY - b.top) };
}

cv.addEventListener("pointerdown", (e) => {
  if (abspielen) return;
  const p = stelle(e);
  let nah = -1;
  let best = 5; // cm - grosszuegig, damit man nicht zielen muss zum Anfassen
  korken.forEach((k, i) => {
    const d = Math.hypot(k.x - p.x, k.y - p.y);
    if (d < best) {
      best = d;
      nah = i;
    }
  });
  if (nah < 0) return;
  cv.setPointerCapture(e.pointerId);
  ziehen = { nr: nah, vonX: p.x, vonY: p.y, zuX: p.x, zuY: p.y };
  malen();
});

cv.addEventListener("pointermove", (e) => {
  if (!ziehen) return;
  const p = stelle(e);
  ziehen.zuX = p.x;
  ziehen.zuY = p.y;
  malen();
});

cv.addEventListener("pointerup", () => {
  if (!ziehen) return;
  const { richtung, kraft } = ausZug(ziehen);
  const nr = ziehen.nr;
  ziehen = null;
  if (kraft < 0.06) return malen();

  const { bilder, ende } = schiesse(korken, nr, richtung, kraft);
  abspielen = { bilder, i: 0, ende };
  hinweisEl.textContent = "…";
  lauf();
});

function lauf() {
  if (!abspielen) return;
  // Zwei Rechenschritte je Bild - sonst dauert das Zuschauen ewig
  const a = abspielen;
  a.i = Math.min(a.i + 2, a.bilder.length - 1);
  a.bilder[a.i].forEach((p, i) => {
    korken[i].x = p.x;
    korken[i].y = p.y;
  });
  malen();

  if (a.i >= a.bilder.length - 1) {
    abspielen = null;
    zeigeWertung();
    return;
  }
  requestAnimationFrame(lauf);
}

function zeigeWertung() {
  const { schluecke, mama, einzeln } = rundenWertung(korken);
  summeEl.textContent = mama ? "MAMA" : schluecke;
  const teile = einzeln
    .map((f, i) => (f ? `Korken ${i + 1}: ${f.mama ? "Deine Mama!" : f.punkte}` : null))
    .filter(Boolean);
  hinweisEl.textContent = teile.length
    ? teile.join(" · ")
    : "Nichts getroffen. Zurückziehen und loslassen.";
}

document.getElementById("neu").addEventListener("click", () => {
  korken = START.map((k) => ({ ...k }));
  abspielen = null;
  ziehen = null;
  summeEl.textContent = "0";
  hinweisEl.textContent = "Korken antippen, zurückziehen, loslassen.";
  malen();
});

window.addEventListener("resize", () => {
  messen();
  malen();
});
messen();
malen();
</script>
</body>
</html>
